<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TDC Student</title><meta name="apple-mobile-web-app-title" content="TDC Student"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#14202e;--mute:#6b7a8c;--line:#e1e8f0;--brand:#0b5cad;--brand2:#e8f1fb;--ok:#1a8f4d;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--card:#18212c;--ink:#e8eef5;--mute:#8a99ab;--line:#26323f;--brand:#5aa9f2;--brand2:#1a2b3d;--ok:#4cc884;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0e141b;--card:#18212c;--ink:#e8eef5;--mute:#8a99ab;--line:#26323f;--brand:#5aa9f2;--brand2:#1a2b3d;--ok:#4cc884;--bad:#ff7b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--brand);color:#fff;padding:12px 14px;z-index:5;display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0}
.who h1{margin:0;font-size:17px;line-height:1.25}
.who p{margin:1px 0 0;font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:38px;height:38px;border-radius:50%;padding:0!important;background:#fff!important;color:var(--brand)!important;font-weight:700;border:0!important}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
#sh[hidden]{display:none}
.sb{background:var(--card);width:100%;max-width:640px;margin:0 auto;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sb h2{margin:0 0 12px;font-size:18px}
header button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:14px}
main{padding:12px 12px 96px;max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font:inherit;font-size:13px;color:var(--ink);min-height:92px}
.tile span{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 6px;border-radius:14px;background:var(--brand2);font-size:24px}
.tile i{display:block;font-style:normal;color:var(--mute);font-size:11px}
input,select,textarea,.btn{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
label{font-size:13px;color:var(--mute);display:block;margin:0 0 3px 2px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;font-weight:600}
.btn.alt{background:var(--brand2);color:var(--brand)}
.btn.del{background:none;color:var(--bad);padding:6px 8px;font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.card .t{font-weight:600}
.card.un .t{color:var(--brand)}
.card .m{color:var(--mute);font-size:13px;margin-top:3px}
.card .b{margin-top:8px;font-size:14px;white-space:pre-wrap}
.card .a{display:flex;justify-content:flex-end;gap:4px;margin-top:4px}
.sc{float:right;font-size:20px;font-weight:700;color:var(--brand)}
.sum{background:var(--brand2);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:600}
.note{background:var(--brand2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.empty{text-align:center;color:var(--mute);padding:26px 0}
details.f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
details.f summary{font-weight:600;color:var(--brand)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--brand);font-weight:600}

body{font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(135deg,#0a4f99,#1c8be6);padding:14px 16px;box-shadow:0 6px 20px rgba(10,79,153,.28)}
.who h1{font-size:19px;letter-spacing:.2px}
.who p{font-size:13px;opacity:.92;margin-top:1px}
#sub2{font-weight:600;font-size:14px;opacity:1}
.av{box-shadow:0 3px 10px rgba(0,0,0,.22)}
main{padding-top:14px}
.tile{border:0;border-radius:20px;box-shadow:0 2px 12px rgba(20,32,46,.07);transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile span{background:hsl(var(--h,210) 85% 93%);border-radius:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile span{background:hsl(var(--h,210) 35% 24%)}}
:root[data-theme="dark"] .tile span{background:hsl(var(--h,210) 35% 24%)}
.card,.item,details.f,.sum,.note{border-radius:16px;box-shadow:0 1px 8px rgba(20,32,46,.05)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span{color:var(--mute);flex:0 0 40%}
.kv b{font-weight:600;text-align:right;word-break:break-word}
.rw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px;box-shadow:0 1px 8px rgba(20,32,46,.05)}
.cl{font-size:14px;padding:3px 0;word-break:break-word}
.cl span{display:block;font-size:12px;color:var(--mute)}
.stamp{text-align:center;color:var(--mute);font-size:12px;margin:6px 0 14px}
.btn{border-radius:12px}
nav{box-shadow:0 -4px 18px rgba(20,32,46,.06)}

header{gap:12px}
.av{width:46px;height:46px;flex:none;font-size:18px}
#back{padding:6px 11px;font-size:20px;line-height:1}
.who small{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
.who h1{font-size:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:block;padding:10px 0}
.kv span{display:block;flex:none;font-size:12px}
.kv b{display:block;text-align:left;font-size:15px;margin-top:2px}
.prof{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#0a4f99,#1c8be6);color:#fff;border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:0 6px 18px rgba(10,79,153,.25)}
.pav{width:54px;height:54px;border-radius:50%;background:#fff;color:#0a4f99;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.prof b{display:block;font-size:17px}
.prof span{font-size:13px;opacity:.9}
</style>
</head>
<body>
<header><button id="back" hidden aria-label="Quay lại">‹</button><button id="acc" class="av" aria-label="Tài khoản">SV</button><div class="who"><small id="brand">TDC Student</small><h1 id="ttl">Sinh viên</h1><p id="sub"></p></div><button id="theme" aria-label="Đổi giao diện sáng tối">◐</button></header>
<main id="app"></main>
<div id="sh" hidden><div class="sb" id="shc"></div></div>
<nav id="nav"></nav>
<script>
const WEB="https://online.tdc.edu.vn/";
const G=[["t","Tiêu đề"],["d","Ngày"],["n","Ghi chú","ta"]];
// m: key, icon, name, fields, link-only?
const M=[
{k:"inbox",i:"✉️",n:"Hộp thư",f:[["f","Người gửi"],["t","Tiêu đề"],["d","Thời điểm"],["b","Nội dung","ta"]]},
{k:"me",i:"👤",n:"Thông tin cá nhân",f:[["t","Mục (MSSV, lớp...)"],["n","Giá trị"]]},
{k:"fee",i:"💳",n:"Học phí / lệ phí",f:[["t","Khoản thu"],["d","Ngày"],["a","Số tiền (đ)","num"],["s","Trạng thái","sel",["Đã đóng","Chưa đóng"]]]},
{k:"debt",i:"📚",n:"Thông báo nợ sách",f:G},
{k:"ctdt",i:"🎓",n:"Chương trình đào tạo",f:[["t","Môn học"],["c","Số tín chỉ","num"],["n","Ghi chú","ta"]]},
{k:"dkhp",i:"📝",n:"Đăng ký học phần",f:[["t","Học phần"],["d","Hạn đăng ký"],["n","Ghi chú","ta"]]},
{k:"tkb",i:"📅",n:"Thời khóa biểu - Lịch thi",f:[["w","Thứ / ngày"],["h","Giờ"],["t","Môn"],["r","Phòng"],["s","Loại","sel",["Lịch học","Lịch thi"]]]},
{k:"grade",i:"📊",n:"Xem điểm",f:[["t","Môn học"],["c","Số tín chỉ","num"],["p","Điểm (thang 10)","num"]]},
{k:"forum",i:"💬",n:"Ý kiến - thảo luận",f:G},
{k:"cvht",i:"🧑‍🏫",n:"Cố vấn học tập",f:G},
{k:"thpt",i:"📄",n:"Nhập văn bằng THPT/THCS",f:G},
{k:"rule",i:"⚖️",n:"Quy chế - học vụ",f:G},
{k:"vp",i:"⚠️",n:"Sinh viên vi phạm",f:G},
{k:"ck",i:"🤝",n:"Sinh viên cam kết",f:G},
{k:"drl",i:"⭐",n:"Điểm rèn luyện",f:[["t","Học kỳ"],["p","Điểm","num"],["n","Xếp loại"]]},
{k:"ev",i:"🎫",n:"Tham gia sự kiện",f:G},
{k:"mon",i:"✅",n:"Ghi danh môn tự chọn",f:G},
{k:"tn",i:"🏅",n:"Đăng ký xét tốt nghiệp",f:G},
{k:"help",i:"ℹ️",n:"Hướng dẫn sử dụng",f:G},
{k:"out",i:"🚪",n:"Thoát",link:1}
];
const SEED={inbox:[
{f:"Nguyễn Thị Kim Hoàng",t:"Thông báo số 1 về tổ chức lấy ý kiến phản hồi từ người học về hoạt động giảng dạy của giảng viên học kỳ 1 năm học 2026-2027",d:"19-11-2026 16:33",u:1},
{f:"Lồ Quang Hương",t:"Thông báo V/v lịch khám sức khỏe định kỳ sinh viên, năm học 2026-2027 (đợt bổ sung). Khám: thứ 7, ngày 14/11/2026",d:"13-11-2026 15:48",u:1},
{f:"P.TCKT",t:"Hóa đơn điện tử ngày: 09-Nov-26 8:38:06 PM",d:"09-11-2026 20:34",u:1},
{f:"P.TCKT",t:"Đã thanh toán phí: 09/11/2026",d:"09-11-2026 10:00"},
{f:"Lồ Quang Hương",t:"Thông báo V/v khám sức khỏe định kỳ sinh viên. Năm học 2026-2027",d:"06-11-2026 16:45"},
{f:"Lồ Quang Hương",t:"Nhắc nhở sinh viên hoàn tất việc đăng ký tạm trú",d:"15-10-2026 16:03"}]};
let D={},cur=null,q="",editIdx=-1,tab="home";
try{D=JSON.parse(localStorage.getItem("tdc")||"null")||{}}catch(e){D={}}
if(!D.inbox){D=SEED}
let P={};try{P=JSON.parse(localStorage.getItem("tdcp")||"{}")}catch(e){}
const PS=()=>{try{localStorage.setItem("tdcp",JSON.stringify(P))}catch(e){}};
const save=()=>{try{localStorage.setItem("tdc",JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mod=k=>M.find(x=>x.k==k);
const money=n=>Number(n||0).toLocaleString("vi-VN")+" đ";

function nav(){const T=[["home","🏠","Trang chủ"],["inbox","✉️","Hộp thư"],["fee","💳","Học phí"],["tkb","📅","TKB"],["bk","💾","Sao lưu"]];
 $("#nav").innerHTML=T.map(([k,i,l])=>`<button class="${(cur||tab)==k?"on":""}" data-go="${k}"><span>${i}</span>${l}</button>`).join("")}

function home(){
 $("#ttl").textContent="TDC Student";$("#back").hidden=true;
 const n=(D.inbox||[]).filter(x=>x.u).length;
 return `<div class="note">${P.token?`Đã đăng nhập · đồng bộ lần cuối: ${P.last?new Date(P.last).toLocaleString("vi-VN"):"chưa có"}`:"Chưa đăng nhập cổng trường."} <button class="btn alt" style="padding:6px 12px;margin-left:6px" data-acc="1">${P.token?"Tài khoản":"Đăng nhập"}</button></div>
 <div class="grid">${M.map(m=>`<button class="tile" style="--h:${(M.indexOf(m)*47+200)%360}" data-go="${m.k}"><span>${m.i}</span>${m.n}<i>${m.k=="inbox"&&n?n+" chưa đọc":m.link?"Mở web":stat(m.k)}</i></button>`).join("")}</div>`}

function nameFrom(pairs,mssv){const L=(pairs||[]).map(([l,v])=>[String(l).normalize("NFC").toLowerCase().trim(),String(v).trim()]);
 const bad=/cha|mẹ|bố|má|người|giám hộ|phụ huynh|trường|lớp|ngành|khoa|hệ|môn|khóa|dân tộc|tôn giáo|quê|nơi|địa chỉ|email|điện thoại|liên hệ|chức|nghề/;
 let f=L.find(([l])=>/^(họ\s*(và\s*)?tên(\s*(sinh viên|sv))?|tên\s*(sinh viên|sv)|sinh viên)$/.test(l));if(f)return f[1];
 f=L.find(([l])=>/(họ\s*(và\s*)?tên|tên\s*(sinh viên|sv|đầy đủ))/.test(l)&&!bad.test(l));if(f)return f[1];
 const h=L.find(([l])=>/^họ(\s*(lót|đệm|và tên đệm|và chữ lót))?$/.test(l)),t=L.find(([l])=>l=="tên");
 if(h&&t)return(h[1]+" "+t[1]).trim();
 const i=L.findIndex(([,v])=>mssv&&v.toLowerCase()==String(mssv).toLowerCase());
 if(i>=0)for(const j of [i+1,i-1]){const c=L[j];if(c&&/(họ|tên)/.test(c[0])&&!bad.test(c[0]))return c[1]}
 return t?t[1]:""}
function autoName(){if(P.nameLock||(P.name&&P.name!=P.mssv))return;const s=(D.pages||{}).me;if(!s||!s.pairs)return;const n=nameFrom(s.pairs,P.mssv);if(n){P.name=n;PS()}}
function cnt(k){const s=(D.pages||{})[k];if(!s||s.err)return(D[k]||[]).length;return(s.pairs||[]).length+(s.tables||[]).reduce((a,t)=>a+t.r.length,0)}
function stat(k){const s=(D.pages||{})[k];if(!s)return(D[k]||[]).length?D[k].length+" mục":"Chưa đồng bộ";
 if(s.err)return"Lỗi · chạm để xem";const n=cnt(k);return n?n+" mục":(s.text?"Có nội dung":"Trống")}
function snap(k){const s=(D.pages||{})[k];if(!s)return"";
 if(s.err)return`<div class="note">Mục này chưa đồng bộ được: ${esc(s.err)}</div>`;
 const kv=(s.pairs||[]).map(([l,v])=>`<div class="kv"${k=="me"?` data-nm="${esc(v)}"`:""}><span>${esc(l)}</span><b>${esc(v)}</b></div>`).join("");
 const tb=(s.tables||[]).map(t=>t.r.map(r=>`<div class="rw">${r.map((c,i)=>c?`<div class="cl">${t.h[i]?`<span>${esc(t.h[i])}</span>`:""}${esc(c)}</div>`:"").join("")}</div>`).join("")).join("");
 const prof=k=="me"&&P.name?`<div class="prof"><div class="pav">${esc(P.name.trim().split(" ").pop()[0].toUpperCase())}</div><div><b>${esc(P.name)}</b><span>MSSV ${esc(P.mssv)}</span></div></div>`:"";
 const hint=k=="me"&&!P.name?`<div class="note">Chưa nhận ra họ tên. Chạm vào dòng họ tên của bạn bên dưới để dùng làm tên hiển thị.</div>`:"";
 const tx=s.text?(kv||tb?`<details class="f"><summary>Xem nội dung trang gốc</summary><div class="b">${esc(s.text)}</div></details>`:`<div class="card"><div class="b">${esc(s.text)}</div></div>`):"";
 const em=!kv&&!tb&&!s.text?`<div class="note">Trang trường không trả về nội dung cho mục này.${s.dbg?` (Trang ${s.dbg.len||0} ký tự, ${(s.dbg.urls||[]).length} trang nhúng)`:""}</div>`:"";
 return prof+hint+(kv?`<div class="card">${kv}</div>`:"")+tb+tx+em+`<div class="stamp">Đồng bộ lúc ${new Date(s.t).toLocaleString("vi-VN")}</div>`}
function line(m,x){
 return m.f.filter(f=>!["t","b","p"].includes(f[0])&&x[f[0]]!==undefined&&x[f[0]]!=="").map(f=>f[2]=="num"&&f[0]=="a"?money(x[f[0]]):esc(x[f[0]])).join(" · ")}

function list(m){
 $("#ttl").textContent=m.n;$("#back").hidden=false;
 const L=D[m.k]||[];
 let sum="";
 if(m.k=="grade"){const c=L.reduce((a,x)=>a+(+x.c||0),0);if(c)sum=`<div class="sum">Điểm TB: ${(L.reduce((a,x)=>a+(+x.c||0)*(+x.p||0),0)/c).toFixed(2)} · ${c} tín chỉ</div>`}
 if(m.k=="fee"){sum=`<div class="sum">Đã đóng: ${money(L.filter(x=>x.s!="Chưa đóng").reduce((a,x)=>a+(+x.a||0),0))}<br>Còn nợ: ${money(L.filter(x=>x.s=="Chưa đóng").reduce((a,x)=>a+(+x.a||0),0))}</div>`}
 if((D.pages||{})[m.k])sum="";
 const items=L.map((x,i)=>[x,i]).filter(([x])=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));
 if(m.k=="tkb")items.sort((a,b)=>(a[0].w+a[0].h).localeCompare(b[0].w+b[0].h));
 const ed=editIdx>=0?L[editIdx]:{};
 const form=m.f.map(f=>{const id="f_"+f[0],v=esc(ed[f[0]]);
  if(f[2]=="ta")return `<label>${f[1]}</label><textarea id="${id}" rows="3">${v}</textarea>`;
  if(f[2]=="sel")return `<label>${f[1]}</label><select id="${id}">${f[3].map(o=>`<option ${ed[f[0]]==o?"selected":""}>${o}</option>`).join("")}</select>`;
  return `<label>${f[1]}</label><input id="${id}" ${f[2]=="num"?'type="number" inputmode="decimal"':""} value="${v}">`}).join("");
 return `<div class="btns"><a class="btn alt" href="${WEB}" target="_blank" rel="noopener">Mở trên web trường</a></div>${sum}${snap(m.k)}
 <details class="f" ${editIdx>=0?"open":""}><summary>${editIdx>=0?"Sửa mục":"Thêm mục mới"}</summary><div style="margin-top:10px">${form}
 <div class="btns"><button class="btn" data-save="1">Lưu</button>${editIdx>=0?'<button class="btn alt" data-cancel="1">Hủy</button>':""}</div></div></details>
 <input id="q" placeholder="Tìm trong mục này" value="${esc(q)}">
 ${items.length?items.map(([x,i])=>`<div class="card ${x.u?"un":""}" data-read="${i}">${x.p!==undefined&&x.p!==""?`<span class="sc">${esc(x.p)}</span>`:""}
 <div class="t">${esc(x.t||x.w||"(không tiêu đề)")}</div><div class="m">${line(m,x)}</div>${x.b?`<div class="b">${esc(x.b)}</div>`:""}
 <div class="a"><button class="btn del" style="color:var(--brand)" data-edit="${i}">Sửa</button><button class="btn del" data-del="${i}">Xóa</button></div></div>`).join(""):'<div class="empty">Chưa có dữ liệu. Bấm "Thêm mục mới" để bắt đầu.</div>'}`}

function backup(){
 $("#ttl").textContent="Sao lưu";$("#back").hidden=true;
 return `<div class="note">Sao lưu giúp chuyển dữ liệu sang máy khác hoặc khôi phục khi xóa trình duyệt.</div>
 <div class="btns"><button class="btn" data-bk="exp">Xuất dữ liệu</button><button class="btn alt" data-bk="imp">Nhập dữ liệu</button><button class="btn del" data-bk="clr">Xóa tất cả</button></div>
 <textarea id="bk" rows="10" placeholder="Dữ liệu xuất ra sẽ hiện ở đây. Để nhập, dán dữ liệu vào đây rồi bấm Nhập dữ liệu."></textarea>
 <div class="note">Muốn đồng bộ tự động với tài khoản trường cần thêm backend đăng nhập online.tdc.edu.vn. Các mục dùng nút "Mở trên web trường" để xem dữ liệu chính thức.</div>`}

function render(){
 nav();let h;
 if(cur){const m=mod(cur);h=list(m)}else if(tab=="bk")h=backup();else h=home();
 $("#app").innerHTML=h;
 autoName();
 const nm=P.name&&P.name!=P.mssv?P.name:"",hm=!cur&&tab=="home";
 $("#brand").hidden=!hm;
 if(hm){$("#ttl").textContent=nm||"Sinh viên";$("#sub").textContent=P.mssv?"MSSV "+P.mssv:"Chưa đăng nhập"}
 else $("#sub").textContent=(nm?nm+" · ":"")+(P.mssv?"MSSV "+P.mssv:"");
 $("#acc").textContent=(nm||"SV").trim().split(" ").pop()[0].toUpperCase()}

function go(k){q="";editIdx=-1;scrollTo(0,0);
 if(k=="home"||k=="bk"){cur=null;tab=k}
 else{const m=mod(k);if(m.link){window.open(WEB,"_blank","noopener");return}cur=k}
 render()}

document.addEventListener("click",e=>{
 const nmEl=e.target.closest("[data-nm]");if(nmEl&&cur=="me"){P.name=nmEl.dataset.nm;P.nameLock=1;PS();render();return}
 const t=e.target.closest("button,a");if(!t)return;
 if(t.id=="acc"||t.dataset.acc){sheet();return}
 if(t.dataset.sh){shAct(t.dataset.sh);return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.id=="back"){go("home");return}
 const m=cur&&mod(cur);
 if(t.dataset.save&&m){const o=editIdx>=0?D[cur][editIdx]:{};
  m.f.forEach(f=>{o[f[0]]=$("#f_"+f[0]).value.trim()});
  if(!Object.values(o).some(v=>v&&v!==true&&v!==1)){alert("Hãy nhập ít nhất một thông tin.");return}
  if(editIdx<0){(D[cur]=D[cur]||[]).unshift(o);if(cur=="inbox")o.u=1}
  editIdx=-1;save();render();return}
 if(t.dataset.cancel){editIdx=-1;render();return}
 if(t.dataset.edit){editIdx=+t.dataset.edit;render();scrollTo(0,0);return}
 if(t.dataset.del){if(confirm("Xóa mục này?")){D[cur].splice(+t.dataset.del,1);save();render()}return}
 if(t.dataset.bk){const a=$("#bk");
  if(t.dataset.bk=="exp"){a.value=JSON.stringify(D);a.select()}
  if(t.dataset.bk=="imp"){try{const j=JSON.parse(a.value);if(typeof j!="object"||!j)throw 0;D=j;save();alert("Đã nhập dữ liệu.");go("home")}catch(x){alert("Dữ liệu không hợp lệ. Hãy dán đúng nội dung đã xuất.")}}
  if(t.dataset.bk=="clr"&&confirm("Xóa toàn bộ dữ liệu trên máy này?")){D={inbox:[]};save();render()}
  return}
 const c=e.target.closest("[data-read]");
 if(c&&cur=="inbox"&&D.inbox[+c.dataset.read].u){D.inbox[+c.dataset.read].u=0;save();render()}
});
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}});
$("#theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#0e141b";r.dataset.theme=d?"light":"dark";try{localStorage.setItem("th",r.dataset.theme)}catch(e){}};
try{const s=localStorage.getItem("th");if(s)document.documentElement.dataset.theme=s}catch(e){}
function diag(){return`<details class="f"><summary>Chi tiết đồng bộ từng mục</summary><div class="b">${SYNC.map(k=>{const m=mod(k),s=k=="inbox"?(D.inboxV2?{}:null):(D.pages||{})[k];return esc(m.n)+": "+(!s?"chưa đồng bộ":s.err?"LỖI - "+s.err:"OK")}).join("\n")}</div></details>`}
function sheet(){const o=P.token;
 $("#shc").innerHTML=`<h2>${o?"Tài khoản":"Đăng nhập cổng trường"}</h2>${o?`<div class="sum">${esc(P.name)}<br>MSSV: ${esc(P.mssv)}<br><small>Đồng bộ lần cuối: ${P.last?new Date(P.last).toLocaleString("vi-VN"):"chưa có"}</small></div><div class="btns"><button class="btn" data-sh="sync">Đồng bộ ngay</button><button class="btn del" data-sh="out">Đăng xuất</button></div>${diag()}`:`<label>MSSV</label><input id="l_u" value="${esc(P.mssv)}" autocomplete="username" autocapitalize="characters" autocorrect="off" spellcheck="false"><label>Mật khẩu</label><input id="l_p" type="password" autocomplete="current-password"><label>Địa chỉ backend</label><input id="l_a" value="${esc(P.api)}" placeholder="Để trống nếu app chạy cùng máy chủ"><div class="btns"><button class="btn" data-sh="in">Đăng nhập và đồng bộ</button></div><div class="note">Mật khẩu chỉ gửi tới backend của bạn để đăng nhập, app không lưu mật khẩu.</div>`}<div class="btns"><button class="btn alt" data-sh="x">Đóng</button></div><div id="shm" class="note" hidden></div>`;
 $("#sh").hidden=false}
const msg=t=>{const m=$("#shm");if(m){m.hidden=false;m.textContent=t}};
async function api(p,o={}){const r=await fetch((P.api||"")+p,{...o,headers:{"Content-Type":"application/json",...(P.token?{Authorization:"Bearer "+P.token}:{})}});
 if(r.status==401&&P.token){P.token="";PS()}
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||"Lỗi "+r.status);return r.json()}
const SYNC=["inbox","me","fee","debt","ctdt","dkhp","tkb","grade","forum","cvht","rule","vp","ck","drl","ev","mon","tn"];
async function sync(cb){D.pages=D.pages||{};
 for(const k of SYNC)if(k!="inbox")D[k]=(D[k]||[]).filter(x=>!x.sy);
 for(let i=0;i<SYNC.length;i++){const k=SYNC[i];cb&&cb(i+1,SYNC.length);
  try{const r=await api("/api/page?m="+k);
   if(k=="inbox"){const old=D.inbox||[],first=!D.inboxV2;
    D.inbox=[...(r.inbox||[]).map(x=>({...x,sy:1,u:(old.find(y=>y.sy&&y.t==x.t&&y.d==x.d)||{u:first?0:1}).u})),...old.filter(x=>!x.sy)];D.inboxV2=1}
   else{D.pages[k]={t:Date.now(),pairs:r.pairs||[],tables:r.tables||[],text:r.text||"",dbg:r.dbg};if(k=="me"){const n=nameFrom(r.pairs,P.mssv)||r.name;if(n&&!P.nameLock){P.name=n;PS()}}}
  }catch(e){if(/hết hạn/.test(e.message))throw e;if(k!="inbox")D.pages[k]={t:Date.now(),err:e.message}}
  save()}
 P.last=Date.now();PS();save()}
async function shAct(a){
 if(a=="x"){$("#sh").hidden=true;return}
 if(a=="out"){P.token="";PS();sheet();render();return}
 try{
  if(a=="in"){P.api=$("#l_a").value.trim().replace(/\/$/,"");P.mssv=$("#l_u").value.trim();msg("Đang đăng nhập...");
   const r=await api("/api/login",{method:"POST",body:JSON.stringify({mssv:P.mssv,password:$("#l_p").value})});
   $("#l_p").value="";P.token=r.token;P.name=r.name||P.mssv;PS()}
  await sync((i,n)=>msg("Đang đồng bộ "+i+"/"+n+" mục..."));$("#sh").hidden=true;render()
 }catch(e){msg(e.message=="Failed to fetch"?"Không kết nối được backend. Hãy chạy app cùng máy chủ backend hoặc kiểm tra địa chỉ.":e.message);render()}}
if(P.token&&Date.now()-(P.last||0)>6*36e5)sync().then(render).catch(()=>{});
render();
</script>
</body>
</html>
